<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Camera Interface</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; }
        img { width: 320px; height: 240px; border: 1px solid #ccc; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; }
        .control-panel { margin-top: 30px; }
        #log { margin-top: 20px; font-size: 14px; color: #555; }
    </style>
    <script>
        function toggleCapture() {
            fetch('/toggle', {
                method: 'POST',
                body: 'ON'
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById("log").innerText = "Capture Open：" + data;
            })
            .catch(error => {
                document.getElementById("log").innerText = "Capture Failure：" + error;
            });
        }

        function loadImage() {
            const img = document.getElementById("image");
            const log = document.getElementById("log");

            const url = "/image?" + new Date().getTime(); // 防止缓存
            img.src = url;
            log.innerText = "请求图像中：" + url;

            img.onerror = function() {
                log.innerText = "Image Load Fail，请确认采集已开启。";
            };

            img.onload = function() {
                log.innerText = "Image Load Success。";
            };
        }

        function sendControl(direction, state) {
            fetch(`/control?dir=${direction}&state=${state}`, {
                method: 'GET'
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById("log").innerText = `控制指令已发送：${direction} = ${state}`;
            })
            .catch(error => {
                document.getElementById("log").innerText = "控制指令发送失败：" + error;
            });
        }

        function setupControlButtons() {
            const directions = ['forward', 'left', 'right', 'backward'];
            directions.forEach(dir => {
                const btn = document.getElementById(`btn-${dir}`);
                btn.addEventListener('mousedown', () => sendControl(dir, 1));
                btn.addEventListener('mouseup', () => sendControl(dir, 0));
                btn.addEventListener('touchstart', () => sendControl(dir, 1));
                btn.addEventListener('touchend', () => sendControl(dir, 0));
            });
        }

        window.onload = setupControlButtons;
    </script>
</head>
<body>
    <h1>ESP32 Camera Interface</h1>

    <!-- 控制按钮 -->
    <button onclick="toggleCapture()">开启采集</button>
    <button onclick="loadImage()">获取图像</button>

    <!-- 静态图像显示 -->
    <h3>Captured Image</h3>
    <img id="image" src="" alt="Captured Image" />

    <!-- 视频流显示 -->
    <h3>Live Stream</h3>
    <p>/stream点击打开视频流</a></p>

    <!-- 方向控制按钮 -->
    <div class="control-panel">
        <h3>方向控制</h3>
        <button id="btn-forward">Forward</button><br>
        <button id="btn-left">Left</button>
        <button id="btn-right">Right</button><br>
        <button id="btn-backward">Backward</button>
    </div>

    <div id="log">点击按钮以控制采集并预览图像。</div>
</body>
</html>
