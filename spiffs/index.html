<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Camera Preview</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; }
        img { width: 320px; height: 240px; border: 1px solid #ccc; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin-top: 20px; }
        #log { margin-top: 20px; color: #555; font-size: 14px; }
    </style>
    <script>
        function loadImage() {
            const img = document.getElementById("image");
            const log = document.getElementById("log");

            // 加时间戳防止缓存
            const url = "/image?" + new Date().getTime();

            img.src = url;
            log.innerText = "请求图像中：" + url;

            img.onerror = function() {
                log.innerText = "❌ 图像加载失败，请检查 ESP32 是否正常响应 /image 接口。";
            };

            img.onload = function() {
                log.innerText = "✅ 图像加载成功。";
            };
        }
    </script>
</head>
<body>
    <h1>ESP32 Camera Preview</h1>
    <button onclick="loadImage()">获取图像</button>
    <br>
    <img id="image" src="" alt="Captured Image" />
    <div id="log">点击按钮以获取图像。</div>
</body>
</html>
