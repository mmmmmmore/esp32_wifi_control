<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Vehicle Control</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>ESP32 Vehicle Control</h1>
    
    <!-- Status Display -->
    <div class="status-panel">
      <div class="status-item">
        <span class="label">Control Status:</span>
        <span id="control-status" class="value">Not Connected</span>
      </div>
      <div class="status-item">
        <span class="label">Angle:</span>
        <span id="angle-display" class="value">0°</span>
      </div>
      <div class="status-item">
        <span class="label">Distance:</span>
        <span id="distance-display" class="value">0%</span>
      </div>
      <div class="status-item">
        <span class="label">Rotation:</span>
        <span id="rotation-display" class="value">0°</span>
      </div>
    </div>

    <!-- Camera + Overlayed Controls -->
    <div class="control-section">
      <h2>Drive & Rotate</h2>
      <div id="viewport">
        <div id="video-container">
          <img id="video" src="" alt="Camera Feed" />
        </div>
        <div class="overlay-controls">
          <div id="dual-grid">
            <div class="pane">
              <h3>Drive (Angle & Distance)</h3>
              <div id="joystick">
                <div id="joystick-base">
                  <div id="joystick-knob"></div>
                </div>
                <div id="joystick-info">
                  <p>Drag to set heading and speed</p>
                </div>
              </div>
            </div>
            <div class="pane">
              <h3>Rotate (Direction & Angle)</h3>
              <div id="rotation">
                <div id="rotation-base">
                  <div id="rotation-knob"></div>
                </div>
                <div id="rotation-info">
                  <p>Drag on the ring to spin (±180°)</p>
                </div>
              </div>
            </div>
          </div>
          <div class="button-group">
            <button id="request-btn" class="btn btn-primary" onclick="requestControl()">Request Control</button>
            <button id="release-btn" class="btn btn-secondary" onclick="releaseControl()" disabled>Release Control</button>
            <button class="btn btn-success" onclick="startStream()">Start Stream</button>
            <button class="btn btn-danger" onclick="stopStream()">Stop Stream</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
