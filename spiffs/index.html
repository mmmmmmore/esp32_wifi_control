<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Smart_Vehicle_Control</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 20px;
    }

    #video-container {
      width: 320px;
      height: 240px;
      background-color: #ccc;
      margin: 0 auto;
      border: 2px solid #333;
    }

    #controls {
      margin: 10px;
    }

    #joystick {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 20px auto;
      background-color: #eee;
      border: 2px solid #333;
      border-radius: 50%;
      touch-action: none; /* 禁止默认触控行为 */
    }

    #knob {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: red;
      border-radius: 50%;
      top: 90px;
      left: 90px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Camera_Zone</h2>
  <div id="video-container">
    <img id="video" src="" width="320" height="240" alt="Camera Feed" />
  </div>

  <div id="controls">
    <button onclick="startStream()">Start</button>
    <button onclick="stopStream()">Stop</button>
  </div>

  <h2>Direction_Ctrl</h2>
  <div id="joystick">
    <div id="knob"></div>
  </div>

  <script>
    const video = document.getElementById('video');
    let streamActive = false;

    function startStream() {
      fetch('/start').then(() => {
        video.src = '/stream';
        streamActive = true;
      });
    }

    function stopStream() {
      fetch('/stop').then(() => {
        video.src = '';
        streamActive = false;
      });
    }

    // 摇杆控制逻辑
    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('knob');
    const radius = 100;
    const knobRadius = 10;

    function updateKnob(dx, dy) {
      const distance = Math.min(Math.sqrt(dx * dx + dy * dy), radius - knobRadius);
      const angle = Math.atan2(dy, dx);

      const x = radius + distance * Math.cos(angle) - knobRadius;
      const y = radius + distance * Math.sin(angle) - knobRadius;

      knob.style.left = `${x}px`;
      knob.style.top = `${y}px`;

      const degree = Math.round(angle * (180 / Math.PI));
      const normalizedDistance = Math.round((distance / (radius - knobRadius)) * 100);

      fetch('/joystick', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ angle: degree, distance: normalizedDistance })
      });
    }

    // 鼠标事件
    knob.onmousedown = function (e) {
      e.preventDefault();
      document.onmousemove = function (eMove) {
        const rect = joystick.getBoundingClientRect();
        const centerX = rect.left + radius;
        const centerY = rect.top + radius;
        const dx = eMove.clientX - centerX;
        const dy = eMove.clientY - centerY;
        updateKnob(dx, dy);
      };
      document.onmouseup = function () {
        document.onmousemove = null;
        document.onmouseup = null;
      };
    };

    // 触控事件
    knob.addEventListener('touchstart', function (e) {
      e.preventDefault();
    }, { passive: false });

    knob.addEventListener('touchmove', function (e) {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = joystick.getBoundingClientRect();
      const centerX = rect.left + radius;
      const centerY = rect.top + radius;
      const dx = touch.clientX - centerX;
      const dy = touch.clientY - centerY;
      updateKnob(dx, dy);
    }, { passive: false });

    knob.addEventListener('touchend', function () {
      // 可选：复位摇杆
      knob.style.left = `${radius - knobRadius}px`;
      knob.style.top = `${radius - knobRadius}px`;
    }, { passive: false });
  </script>

</body>
</html>
