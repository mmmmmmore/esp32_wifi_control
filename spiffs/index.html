<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ESP32 Camera & Motor Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
        img {
            width: 320px;
            height: 240px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        h2, h3 {
            margin-top: 20px;
        }
    </style>
    <script>
        function sendControlCommand(dir) {
            const url = `/control?dir=${dir}&state=1`;
            fetch(url)
                .then(response => response.text())
                .then(data => console.log("Motor Response:", data))
                .catch(error => console.error("Motor Error:", error));
        }

        function toggleCapture(state) {
            fetch('/toggle', {
                method: 'POST',
                body: state ? 'ON' : 'OFF'
            })
            .then(response => response.text())
            .then(data => console.log("Capture Response:", data))
            .catch(error => console.error("Capture Error:", error));
        }
    </script>
</head>
<body>
    <h2>Camera_Section</h2>
    /stream

    <h3>Image_Capture</h3>
    <button onclick="toggleCapture(true)">Start_Capture</button>
    <button onclick="toggleCapture(false)">Stop_Capture</button>

    <h3>Wheel_Control</h3>
    <button onclick="sendControlCommand('forward')">Forward</button>
    <button onclick="sendControlCommand('backward')">BackWard</button>
    <button onclick="sendControlCommand('left')">Left</button>
    <button onclick="sendControlCommand('right')">Right</button>
    <button onclick="sendControlCommand('crotator')">Clk_Rotor</button>
    <button onclick="sendControlCommand('acrotator')">AClk_Rotor</button>
</body>
</html>
