<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Vehicle Control</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>ESP32 Vehicle Control</h1>
    
    <!-- Status Display -->
    <div class="status-panel">
      <div class="status-item">
        <span class="label">Control Status:</span>
        <span id="control-status" class="value">Not Connected</span>
      </div>
      <div class="status-item">
        <span class="label">Angle:</span>
        <span id="angle-display" class="value">0°</span>
      </div>
      <div class="status-item">
        <span class="label">Distance:</span>
        <span id="distance-display" class="value">0%</span>
      </div>
    </div>

    <!-- Joystick Control -->
    <div class="control-section">
      <h2>Joystick Control</h2>
      <div id="joystick-container">
        <div id="joystick">
          <div id="joystick-base">
            <div id="joystick-knob"></div>
          </div>
        </div>
        <div id="joystick-info">
          <p>Drag the knob to control direction and speed</p>
        </div>
      </div>
      
      <div class="button-group">
        <button id="request-btn" class="btn btn-primary" onclick="requestControl()">Request Control</button>
        <button id="release-btn" class="btn btn-secondary" onclick="releaseControl()" disabled>Release Control</button>
      </div>
    </div>

    <!-- Camera Section (Optional) -->
    <div class="control-section">
      <h2>Camera Stream</h2>
      <div id="video-container">
        <img id="video" src="" alt="Camera Feed" />
      </div>
      <div class="button-group">
        <button class="btn btn-success" onclick="startStream()">Start Stream</button>
        <button class="btn btn-danger" onclick="stopStream()">Stop Stream</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
